[project]
name = "trackrelay"
version = "0.1.0"
description = "A reliable shipment-event integration gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.35,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
trackrelay-baseline = "trackrelay.experiments.baseline:main"
trackrelay-aws-check = "trackrelay.aws_preflight:main"
trackrelay-aws-rehost = "trackrelay.aws_rehost:main"
trackrelay-aws-session = "trackrelay.aws_session:main"
trackrelay-aws-vertical-scaling = "trackrelay.aws_vertical_scaling:main"
trackrelay-aws-vertical-scaling-report = "trackrelay.aws_flexibility_report:main"
trackrelay-aws-vertical-scaling-session = "trackrelay.aws_vertical_scaling_session:main"
trackrelay-aws-vertical-scaling-canary = "trackrelay.aws_vertical_scaling_canary:main"
trackrelay-generate = "trackrelay.experiments.generator:main"
trackrelay-load-experiment = "trackrelay.experiments.performance:experiment_main"
trackrelay-prepare-load = "trackrelay.experiments.performance:main"
trackrelay-reconcile = "trackrelay.experiments.reconciliation:main"
trackrelay-scenario = "trackrelay.experiments.scenarios:main"
trackrelay-worker = "trackrelay.worker:main"

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = '-m "not integration"'
markers = [
    "integration: requires the configured PostgreSQL database",
]
